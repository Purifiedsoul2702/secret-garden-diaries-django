# EXAMPLE ONLY: replace domain, TLS paths and project path. Run nginx -t before reload.
server {
    listen 80;
    server_name yourdomain.in www.yourdomain.in;
    return 301 https://yourdomain.in$request_uri;
}
server {
    listen 443 ssl;
    server_name yourdomain.in www.yourdomain.in;
    ssl_certificate /etc/letsencrypt/live/yourdomain.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    location /static/ { alias /srv/secret-garden-diaries/staticfiles/; }
    location /media/ {
        alias /srv/secret-garden-diaries/media/;
        add_header X-Content-Type-Options nosniff always;
        # Uploaded images are re-encoded as JPEG; never add a script handler here.
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    # Recommended: restrict /admin/ at your firewall/access gateway to your own IP/VPN.
}
