{% load garden_tags %}<article class="plant-card"><a class="plant-photo" href="{{ plant.get_absolute_url }}"><img src="{% photo plant %}" alt="{{ plant.name|tr:lang }}" loading="lazy" width="500" height="500">{% if plant.beginner %}<span class="photo-badge">{{ ui.beginner }}</span>{% endif %}</a><div class="plant-card-body"><span class="eyebrow">{{ plant.get_category_display }}</span><h3><a href="{{ plant.get_absolute_url }}">{{ plant.name|tr:lang }}</a><span>↗</span></h3><p class="scientific">{{ plant.scientific_name }}</p><div class="plant-meta"><span>☀ {{ plant.min_sun }}+ h direct sun</span><span>◒ {{ plant.container_cm }} cm pot</span></div></div></article>
